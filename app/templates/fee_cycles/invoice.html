<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice {{ invoice_number }} — Fee Track</title>
    <style>
        @media screen {
            .toolbar {
                max-width: 760px;
                margin: 20px auto 0;
                padding: 0 4px;
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                font-family: Helvetica, Arial, sans-serif;
            }
            .toolbar a, .toolbar button {
                font: inherit;
                font-size: 9.5pt;
                font-weight: 600;
                border-radius: 6px;
                padding: 8px 16px;
                cursor: pointer;
                text-decoration: none;
            }
            .toolbar a {
                background: #0f172a;
                color: #ffffff;
                border: 1px solid #0f172a;
            }
            .toolbar a:hover { background: #1e293b; }
            .toolbar button {
                background: #ffffff;
                color: #334155;
                border: 1px solid #cbd5e1;
            }
            .toolbar button:hover { background: #f8fafc; }
        }
        /* The Print button opens a separate thermal-formatted popup (see
           below) rather than printing this page — but if an admin hits
           Ctrl+P on this preview directly, still hide the toolbar so it
           doesn't end up in that printout. */
        @media print {
            .toolbar { display: none; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button type="button" onclick="window.open('/fee-cycles/{{ cycle.id }}/invoice/print', 'thermal-print-{{ cycle.id }}', 'width=420,height=640')">Print</button>
        <a href="/fee-cycles/{{ cycle.id }}/invoice.pdf">Download PDF</a>
    </div>

    {% include "fee_cycles/_invoice_document.html" %}

</body>
</html>
