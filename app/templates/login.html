<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raabta — Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-slate-800 text-white font-semibold text-lg mb-4">
                R
            </div>
            <h1 class="text-xl font-semibold text-slate-900">Raabta Admin</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to manage attendance and fees.</p>
        </div>

        <form method="post" action="/login" class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-4">

            {% if error %}
            <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    required
                    autofocus
                    autocomplete="username"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800"
                    placeholder="you@school.edu"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    autocomplete="current-password"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800"
                    placeholder="••••••••"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-md bg-slate-800 text-white text-sm font-medium py-2.5 hover:bg-slate-700 transition-colors"
            >
                Sign in
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Admin access only. Contact the super-admin if you need an account.
        </p>
    </div>

</body>
</html>
