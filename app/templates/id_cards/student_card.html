<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.name }} — ID Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col items-center py-10 gap-6">

    <div class="no-print flex items-center gap-3">
        <button onclick="window.print()" class="rounded-md bg-slate-800 text-white text-sm font-medium px-4 py-2 hover:bg-slate-700">
            Print this card
        </button>
        <a href="/students/{{ student.id }}" class="text-sm text-slate-600 hover:text-slate-900">Back to student</a>
    </div>

    <div class="bg-white border border-slate-300 rounded-xl shadow-sm w-80 p-6 text-center">
        <div class="text-xs font-semibold tracking-wide text-slate-400 uppercase mb-4">Raabta Student ID</div>
        <img src="/students/{{ student.id }}/qr-code.png" alt="QR code" class="mx-auto w-40 h-40 mb-4">
        <div class="text-lg font-semibold text-slate-900">{{ student.name }}</div>
        <div class="text-sm text-slate-500">{{ student.class_level.name }}</div>
        <div class="mt-3 font-mono text-xl tracking-widest text-slate-900">{{ student.roll_number }}</div>
    </div>

</body>
</html>
