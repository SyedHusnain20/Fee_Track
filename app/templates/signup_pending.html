<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Track — Request Submitted</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">

    <div class="w-full max-w-sm text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-100 text-amber-600 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h1 class="text-xl font-semibold text-slate-900">Waiting for super admin approval</h1>
        <p class="text-sm text-slate-500 mt-2">
            Your request has been submitted. You'll be able to sign in with the email and
            password you just entered as soon as a super admin approves your account.
        </p>

        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mt-6 text-left">
            <p class="text-sm text-slate-600">
                No further action is needed from you right now.
            </p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            <a href="/login" class="text-slate-600 hover:text-slate-800 underline">Back to sign in</a>
        </p>
        <p class="text-center text-xs text-slate-400 mt-2">
            Powered by R&amp;R Digital Solutions
        </p>
    </div>

</body>
</html>
