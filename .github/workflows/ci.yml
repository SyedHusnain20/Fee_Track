name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # Dummy values so app.core.config.Settings() can load in CI —
      # no real Postgres connection is needed for the current test suite.
      SECRET_KEY: ci-test-secret-key
      POSTGRES_USER: raabta
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: raabta
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v
